version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models/solar_cnn_best.pth
      - USE_ONNX=false
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ../models:/app/models
      - ../data/sample:/app/data/sample
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
